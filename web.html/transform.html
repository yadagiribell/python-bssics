<!DOCTYPE html>
<html>
    <head>
        <style>
            .box{
                width: 150px;
                height: 150px;
                border: 5px solid black;
                font-size: 1.6em;
                text-align: center;
                padding: 15px;
                border-radius: 10px;
               
                transform:translateX(100px) scale(0.8) rotate(135deg)
                
            }
            #box1{
                background-color: red;
            }
            #box2{
                background-color: blue;
            }
            #box3{
                background-color:yellow;
            }
            
        </style>

    </head>
    <body>
        <div class="box" id="box1">SREEKANTH</div>
        <div class="box" id="box2">SREEKANTH</div>
        <div class="box" id="box3">SREEKANTH</div>


        


       
    </body>
</html>
