<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <form>
            <label for="username">username:</label>
            <input type="text" id="username" placeholder="enter username">
            <br>
            <label for="password">password:</label>
            <input type="password" id="password" placeholder="enter password">
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="enter email">
            <br>
            <label for="bithdate">birthdate:</label>
            <input type="date" id="birthdate" placeholder="enter birthdate">
            <br>
            <label for="gender">Gender:</label>
            <label for="male">Male</label>
            <input type="radio" id="male" value="male" name="gender">     <!..radio button..>
            <label for="female">Female</label>
            <input type="radio" id="female" value="female" name="gender">
            <label for="transgender">Transgender</label>
            <input type="radio" id="transgender" value="transgender" name="gender">
            <br>
            <label for="payment">Payment</label>
            <select id="payment">
                <option value="debit card">Debit card</option>
                <option value="credit card">Credit card</option>    <!..drop down list..>
                <option value="upi">UPI</option>
                
            </select>
            <br>

            <input type="submit">

        </form>
    </body>
</html>
