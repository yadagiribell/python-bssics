<!DOCTYPE html>
<html>
    <head>
        <style>
            a :link{
                color: chocolate;

            }
           
            a :hover{
                color: blue;
                font-size: 1.1em;
            }
            a :visited{
                color: purple;
            }
        </style>

    </head>
    <body>
        <!--pseudo classes are
        1.hover and not hover-when we place cursor the action will be done
        2.active - when we click on the link it will in active
        3.visited - means after visiting
        -->
        <a href="shadows.html">shadow</a>
    </body>
</html>
