<!DOCTYPE html>
<html>
    <head>
        <!..display properties are used to how to display 
        1.block-means only block
        2.inline-means throughout the line..>
        <style>
            div{
                background-color: blue;
                height: 200px;
                width: 200px;
                display: inline-block;
            }
            span{   
                background-color: red;
                height: 200px;
                width: 200px;
                display: inline-block;
            }
        </style><!..height and width is not applicable for span tags but we change it by display block property..>

    </head>
    <div>div</div>
    <span>span</span>
