<!DOCTYPE html>
<html>
    <head>
        <style>
            .container{
                background-color: blue;
                height: 100vh;
            }
            .box{
                 background-color: aqua;
                border: 3px solid yellow;
                
                height: auto;
                width: 50%;
                float: left;
                text-align: center;
                min-height: 50%;
                box-sizing: border-box;
                
            }
        </style>

    </head>
    <body>
        <div class="container">
            <div class="box">this is box1</div>
            <div class="box">this is box2</div>
        </div>
    </body>
</html>
