<!DOCTYPE html>
<html>
    <head>
        <title>border</title>
        <style>
            #h1{
                border-style: solid;
                border-width: 3px;
                border-color: blue;
                border-radius:10px;
                width: 200px;
                height: 20px;
            }
            #h2{
                border: 3px dotted darkcyan;   <!..we can use border width ,border style border color in border property..>
            }
            pre{
                border-bottom: 5px solid black;  
                border-top: 10px dotted yellow;
                border-left: 3px double orange;
                border-right: 4px solid red;
            }
        </style>
    </head>
    <body>
        <h1 id="h1">YADAGIRI</h1>
        <br>
        <h1 id="h2">SHEKAR</h1>
        <br>
        <pre>
            at least as the deep 
            as the pacafic ocean 
            i wanna be yours
            secrets i had held in 
            my heart
            are harder to hide
            than i thought
            may be i am just
            wanna be yours
        </pre>

    </body>
</html>
