<!DOCTYPE html>
<html>
    <head>
        <style>
            .container{
                width: 20%;
                height: 300px;
                
                background-image: url('bird1.png');
                background-position: center;
                background-size: 150%;
                display: flex;
                flex-direction: column;
                padding: 40px;
                box-shadow: 1px 1px 20px black;
                align-items: center;
                margin: auto;
                border: 3px solid yellow;
                border-radius: 10px;
            }
            
            .container .input{
               width: 100%;
               height: 100%;
            }
            button{
                color: white;
                background-color: blue;
                cursor: pointer;
                border: none;
                height: 40px;
            }
            .inputfield:focus{
                box-shadow: 5px 5px 10px navy;
            }
            button:hover{
                transform: scale(1.2);
            }
        </style>

    </head>
    <body>
        <div class="container">
            <input type="text" name="first name" id="first name" placeholder="enter first name"><br>
            <input type="text" name="last name" id="last name" placeholder="enter last name"> <br>
            <input type="password" name="password" id="password" placeholder="enter password"><br>
            <input type="password" name="confirm password" id="confirm password" placeholder="enter confirm password"><br>
            <input type="email" name="email" id="email" placeholder="enter email"><br>
            <input type="mobile no" name="first name" id="mobile no" placeholder="enter mobile no"><br>
            <button>Register</button>
        </div>
     

    </body>
</html>
