<!DOCTYPE html>
<html>
    <head>
        <!--pagination is defined as the method which a document is seperated into pages
        and numbers are given ..by that page no we can go through that page-->
        <style>
            .pagination {
                text-align: center;
            }
            .pagination a{ 
                color: black;
                text-decoration: none;
                padding: 15px 15px;
                display: inline-block;
                
            }
            .pagination a.active{
                background-color: aqua;
                font-weight: bold;
                border-radius: 10px;
            }
            .pagination a:hover:not(.active){
                background-color: gold;
                border-radius: 10px;
            }



        </style>
    </head>
    <body>
        <h1>This is page #1</h1>

            may be i am just wanna be yours...
        </p>

        <a href="page4.html">4</a>
        <a href="page5.html">5</a>

        </div>
    </body>
</html>
