<!DOCTYPE html>
<html>
    <head>
        <title>shadows</title>  <!..shadows are two types text shadow and box shadow..>
        <style>
            #h1{
                text-shadow: 10px 10px 5px red,-10px -10px 5px skyblue;
                font-size: 50px;
               
            }
            #h2{
                text-shadow: 10px 10px 5px red,-10px -10px 5px skyblue;
                font-size: 50px;
                
            }
            #h3{
                text-shadow: 10px 10px 5px red,-10px -10px 5px skyblue;
                font-size: 50px;

            }
            #h4{
                text-shadow: 10px 10px 5px red,-10px -10px 5px skyblue;
                font-size: 50px;
            }

            #box1{
                width: 200px;
                height: 200px;
                background-color: black;
                box-shadow: 20px 20px 100px ;
            }
        </style>       <!..in text-shadow there are 3 parameters horizontal,vertical,blur  if we give minus values then it will go to left and up..>

    </head>
    <body>
        <h1 id="h1">YADAGIRI</h1>
        <h1 id="h2">SACHIN</h1>
        <h1 id="h3">KARTHIK</h1>
        <h1 id="h4">YOGESHWAR</h1>
        <div id="box1"></div>
    </body>
</html>
