<!DOCTYPE html>
<html>
    <head>
        <style>
            
            #img1{
                width: 200px;
                height: 200px;
                animation-name: rotatey;
                animation-duration: 15s;
                  
            }
            @keyframes rotatey{
                100%{transform: rotateX(360deg)}
            }
            #img2{
                width: 200px;
                height: 200px;
                animation-name: grow;
                animation-duration: 15s;
                  
            }
            @keyframes grow{
                100%{transform:scale(2,2)}
            }
            #img3{
                width: 200px;
                height: 200px;
                animation-name: shrink;
                animation-duration: 10s;
                  
            }
            @keyframes shrink{
                50%{transform:scale(0.5, 0.5)}
            }
            h1{
                width: 50px;
                height: 50px;
                animation-name: ram;
                animation-duration: 10s;
                  
            }
            @keyframes  ram{
                50%{transform:rotateY(135deg)}


            }
            h2{
                width: 50px;
                height: 50px;
                animation-name: ram;
                animation-duration: 10s;
                  
            }
            @keyframes  ram{
                50%{transform:rotateY(135deg)}


            }
            h3{
                width: 200px;
                height: 200px;
                animation-name: fadeIn;
                animation-duration: 10s;
                opacity: 0;
                  


            }
            @keyframes  fadeIn{
                100%{opacity: 1;}
            }

            



        </style>

    </head>
    <body>
        <img class="img1" id="img1"  src="bird1.png">
        <img class="img2" id="img2" src="bird1.png">
        <img class="img3" id="img3" src="bird1.png">
        <h1>RAMANJANEYULU</h1>
        <h2>KARTHIK</h2>
        <h3>YOGESHWAR</h3>
    </body>
</html>
