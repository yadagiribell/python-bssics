<!DOCTYPE html>
<html>
    <head>
        <title>font</title>
        <style>
            body{
                background-color: black;
            }
            h1{
                color: white;
            }
            #p1{
                color: white;       <!..if there is id we will specify id with # ..>
            }
            #p2{
                color: red;
            }
            p.yellow{                    <!..if there is class we will specify class with .  ..>

            }

        </style>
    </head>

        <p id="p2" class="red">jfkjdkfjdklfjuwiojklsiokm,dnfdjamlskokeomwlkjkdmf,djij</p>
        <p id="p3" class="yellow">dkjjiwojkwojsikjk,mksnmbind, kcccccninee,wllm</p>
    </body>
</html>
